# Leakage-safe screens and exact decoder calibration for xgb-performance-v2.
schema_version: 1
phase8_version: gbdt-performance-v2
baseline_model_version: xgb-performance-v2

screen:
  held_out_folds: [0, 1]
  representative_routes_per_lab: 2
  maximum_training_rows_per_route: 100000
  maximum_validation_rows_per_route: 25000
  threshold_grid: [0.10, 0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 0.95]
  feature_candidates:
    baseline:
      solo: [metric, invariant, temporal, boundary, quality, metadata]
      pair: [metric, egocentric, temporal, group, quality, metadata]
    no_metadata:
      solo: [metric, invariant, temporal, boundary, quality]
      pair: [metric, egocentric, temporal, group, quality]
    raw_geometry:
      solo: [raw, invariant, temporal, boundary, quality, metadata]
      pair: [raw, egocentric, temporal, group, quality, metadata]
  hyperparameter_candidates:
    baseline: {}
    depth4_regularized:
      max_depth: 4
      min_child_weight: 10.0
      reg_lambda: 8.0
    depth8:
      max_depth: 8
      min_child_weight: 5.0
      reg_lambda: 5.0
    sqrt_weighted:
      positive_class_weight: sqrt_auto
    fully_weighted:
      positive_class_weight: auto
    rows50000:
      maximum_training_rows_per_route: 50000
      negative_to_positive_ratio: 3.0
    rows150000:
      maximum_training_rows_per_route: 150000
      negative_to_positive_ratio: 5.0

hard_negative:
  # The v1 hard-negative implementation reduced AP, so it remains an ablation.
  enabled: false
  top_rows_per_lab_action_fold: 500
  minimum_probability: 0.7
  repeat_count: 1

importance:
  permutation_models_per_route: 1
  maximum_validation_rows: 10000
  seed: 2025

routing:
  blend_weights: [0.0, 0.25, 0.50, 0.75, 1.0]
  minimum_component_improvement: 0.005
  minimum_winning_folds: 3

decoder:
  additional_smoothing_seconds: [0.0, 0.1, 0.2, 0.4]
  threshold_grid: [0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45, 0.50, 0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85, 0.90, 0.95, 0.975]
  hysteresis_delta: [0.0, 0.03, 0.05, 0.10]
  gap_fill_seconds: [0.0, 0.0333333333, 0.0666666667, 0.1, 0.1666666667, 0.2666666667, 0.5]
  minimum_run_seconds: [0.0, 0.0333333333, 0.0666666667, 0.1, 0.1666666667, 0.2666666667, 0.5, 1.0]
  minimum_lab_action_positive_frames: 500
  minimum_lab_action_positive_videos: 2
  minimum_action_positive_frames: 2000

promotion:
  minimum_exact_fbeta_gain: 0.0005
  seed: 2025
  retrain_selected_model: true
  promoted_model_version: xgb-performance-v2-tuned
  minimum_exact_model_gain: 0.001
