[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mabe-behavior"
version = "0.1.0"
description = "MABe mouse behavior detection competition pipeline"
requires-python = ">=3.12,<3.15"
dependencies = [
    "numpy>=2.0,<2.6",
    "scipy>=1.17,<1.19",
    "pandas>=3.0,<3.1",
    "polars>=1.40,<1.44",
    "pyarrow>=24,<26",
    "scikit-learn>=1.8,<1.10",
    "xgboost>=3.2,<3.5",
    "torch>=2.10,<2.14",
    "PyYAML>=6.0,<7",
    "pydantic>=2.11,<3",
    "typer>=0.16,<1",
    "rich>=14,<16",
    "psutil>=7,<8",
]

[project.optional-dependencies]
advanced = [
    "lightgbm>=4.6,<4.8",
    "catboost>=1.2,<1.3",
    "optuna>=4.8,<5",
    "optuna-integration>=4.8,<5",
    "torch-geometric>=2.6,<3",
]
storage = [
    "zarr>=3.1,<4",
    "numcodecs>=0.16,<1",
    "orjson>=3.11,<4",
]
notebook = [
    "jupyterlab>=4.4,<5",
    "notebook>=7.4,<8",
    "ipykernel>=6.30,<8",
    "ipywidgets>=8.1,<9",
]
dev = [
    "pytest>=8.4,<10",
    "pytest-cov>=6.2,<8",
    "hypothesis>=6.130,<7",
    "ruff>=0.12,<1",
    "mypy>=1.17,<2",
    "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
mabe = "mabe.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --doctest-modules"
pythonpath = ["src"]
testpaths = ["tests", "src"]
markers = ["integration: tests that inspect more than lightweight metadata"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/mabe/metric.py" = ["E501", "I001"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mabe"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mabe.metric"
ignore_errors = true
