    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(125.951842 171.7802)">+ laboratory adapter</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(224.801916 150.67547)">6 residual TCN blocks</text>
