    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(21.943178 176.860057)">GN + GELU → 128</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(132.714006 154.278491)">Add laboratory/</text>
