    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(233.818134 167.594265)">Dilations 1, 2, 4,</text>
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(246.0094 176.273534)">8, 16, 32</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.7px; font-family: 'Times New Roman', 'DejaVu Serif', serif" transform="translate(339.3873 150.680885)">4 attention blocks</text>
